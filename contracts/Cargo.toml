[package]
name = "z-latch-pay"
version = "0.1.0"
edition = "2021"
description = "Latch autopay guard for Trinity z-space tenants — payee allowlist + amount cap enforced inside the TEE before any payment egress, with the vendor IBAN travelling only as a host-resolved placeholder"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
